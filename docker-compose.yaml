services:
  db:
    image: postgres:18
    container_name: peluqueria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peluqueria
      POSTGRES_PASSWORD: dev_local_2024
      POSTGRES_DB: peluqueria
    ports:
      - "5434:5432"   # 5434 en el equipo: el 5432 lo pueden ocupar otros Postgres locales
    volumes:
      - peluqueria_pgdata:/var/lib/postgresql

volumes:
  peluqueria_pgdata: